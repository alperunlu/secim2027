name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Güncelleme notu"
        required: true
        default: "Güncelleme"
      channel:
        description: "EAS kanalı"
        required: true
        default: "production"

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: game-html.js'i index.html'den üret
        run: npm run sync-game
      - name: OTA yayınla
        run: npx --yes eas-cli@latest update --channel "${{ inputs.channel }}" --message "${{ inputs.message }}" --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
