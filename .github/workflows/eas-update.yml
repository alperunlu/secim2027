name: EAS Update (OTA)

# OTA yalnızca `ota` dalına gelen push/merge ile yayınlanır.
# Akış: main'de geliştir -> yayınlamaya karar verince main'i ota'ya merge et.
on:
  push:
    branches: [ota]
  workflow_dispatch:
    inputs:
      message:
        description: "Güncelleme notu"
        required: false
        default: "Güncelleme"

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: game-html.js'i index.html'den üret
        run: npm run sync-game
      - name: OTA yayınla
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message || inputs.message }}
        run: |
          MSG_LINE="$(printf '%s' "$MSG" | head -n1)"
          npx --yes eas-cli@latest update --channel production --message "${MSG_LINE:-Güncelleme}" --platform ios --non-interactive
