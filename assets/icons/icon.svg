<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kelime markası: oyunun başlık ekranındaki hiyerarşi —
       SEÇİM altın ve baskın, 2027 kırmızı ve altında.
       NOT: SVG letter-spacing son harften sonra da boşluk eklediği için
       text-anchor="middle" metni yarım aralık sola kaydırır; x telafili. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%"   stop-color="#2b2218"/>
      <stop offset="48%"  stop-color="#1d1710"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d492"/>
      <stop offset="52%"  stop-color="#d2a83c"/>
      <stop offset="100%" stop-color="#a8842c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d0455a"/>
      <stop offset="100%" stop-color="#8e2231"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="30" fill="url(#bg)"/>

  <rect x="35" y="35" width="442" height="442" rx="4"
        fill="none" stroke="#8f7526" stroke-width="3" opacity="0.55"/>
  <rect x="49" y="49" width="414" height="414" rx="2"
        fill="none" stroke="#5f4d18" stroke-width="1" opacity="0.7"/>

  <text x="259" y="241" text-anchor="middle"
        font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Liberation Serif', serif"
        font-size="98" font-weight="bold" letter-spacing="6"
        fill="url(#gold)">SEÇİM</text>

  <text x="260" y="356" text-anchor="middle"
        font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Liberation Serif', serif"
        font-size="79" font-weight="bold" letter-spacing="9"
        fill="url(#red)">2027</text>

  <g fill="#8f7526" opacity="0.7">
    <circle cx="256" cy="76" r="3.5"/>
    <circle cx="256" cy="436" r="3.5"/>
  </g>
</svg>
